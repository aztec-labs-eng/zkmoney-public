<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Chromium browsers tint their chrome with this. Safari 26 ignores it and samples a fixed
         element at the viewport edge instead, which #tint below exists to be. Both carry the
         colour the top of the app shows. -->
    <meta name="theme-color" content="#49087e" />
    <meta name="color-scheme" content="dark" />
    <title>zk.money</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Chat apps render these as a card. socialPreview.ts fills the __OG_*__ values per page: the
         zk.money card here, a payment-link card at /link and /request. -->
    <meta name="description" content="__OG_DESCRIPTION__" />
    <meta property="og:site_name" content="zk.money" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__OG_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="zk.money, your money is your business" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITLE__" />
    <meta name="twitter:image" content="__OG_IMAGE_URL__" />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/Sen-VariableFont.ttf" crossorigin />
    <style>
      /* The brand font is declared here, not only in the design system's fonts.css: that arrives
         with the JS bundle, so the boot screen painted before it in a fallback face. Blocking, not
         swapping, so the boot screen never shows a fallback face first. Served from public/ because
         a path outside this package resolves at build but not in dev. */
      @font-face {
        font-family: "Sen";
        src: url("/fonts/Sen-VariableFont.ttf") format("truetype-variations");
        font-weight: 400 800;
        font-style: normal;
        font-display: block;
      }
      /* Page chrome outside the app column; the design system owns everything inside. */
      html,
      body {
        margin: 0;
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        background: #070707;
        font-family: "Sen", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Safari 26 tints its toolbars from the background-color of fixed elements at the viewport
         edge and ignores the theme-color meta. This strip is here to be that element and nothing
         else: it carries the colour the top of the app shows, and the app's own opaque surface
         paints over it, so it is never seen. */
      #tint {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: #49087e;
        pointer-events: none;
        z-index: -1;
      }
      /* The boot screen. It paints before any script runs, shows while #root is empty or the app
         shows a BootSplash (body[data-booting]), and stays one element through
         every boot stage. "shell" drops its surface over a shell already on screen; bootLeaving
         fades it without unrendering it, so a stage that follows keeps it spinning. Its own layer
         and containment keep the spin off the main thread the boot keeps busy. */
      #boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #bfc2d7;
        /* Dark as an image over #tint's colour, which Safari's toolbar tint reads from it. */
        background: linear-gradient(#070707, #070707) #49087e;
        pointer-events: none;
        contain: strict;
        transition: opacity 200ms ease-out;
      }
      #root:empty ~ #boot-splash,
      body[data-booting] #boot-splash {
        display: flex;
      }
      body[data-booting="shell"] #boot-splash {
        background: none;
      }
      body[data-boot-leaving] #boot-splash {
        opacity: 0;
      }
      /* The box turns, not the svg, as the design system's Spinner does. */
      #boot-splash-spinner {
        animation: boot-splash-spin 1.4s linear infinite;
        will-change: transform;
      }
      #boot-splash-spinner > svg {
        display: block;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="tint" aria-hidden="true"></div>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <span id="boot-splash-spinner">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle
            cx="14"
            cy="14"
            r="12.32"
            stroke="currentColor"
            stroke-width="3.36"
            stroke-linecap="round"
            stroke-dasharray="61.93 15.48"
          />
        </svg>
      </span>
      <span>Loading zk.money…</span>
    </div>
    <script type="module" src="/src/boot.tsx"></script>
  </body>
</html>
