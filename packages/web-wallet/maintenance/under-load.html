<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <!-- web-wallet-maintenance.sh finds the notice by this tag; keep it on every revision. -->
    <meta name="zk-money-under-load" />
    <!-- Brings visitors back to the wallet on its own once the swap is reverted. -->
    <meta http-equiv="refresh" content="60" />
    <title>zk.money</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <style>
      @font-face {
        font-family: "Sen";
        src: url("/fonts/Sen-VariableFont.ttf") format("truetype-variations");
        font-weight: 400 800;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        /* The design system's .zkm-bg--aurora backdrop. */
        background: radial-gradient(480px at 55% 5%, rgba(153, 7, 255, 0.5), transparent 70%),
          radial-gradient(480px at 50% 30%, rgba(83, 73, 255, 0.4), transparent 70%),
          radial-gradient(480px at 45% 55%, rgba(3, 150, 255, 0.25), transparent 70%), #070707;
        background-attachment: fixed;
        font-family: "Sen", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 16px;
      }
      /* The wallet's .ww-brand lockup, at 1.5x. */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        zoom: 1.5;
      }
      .tile {
        position: relative;
        width: 44px;
        height: 44px;
        overflow: hidden;
        border-radius: 8px;
        background: #181818;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
        font-size: 10.5px;
        line-height: 0.77;
        letter-spacing: -0.25px;
        color: #fdfdfd;
      }
      .tile svg {
        position: absolute;
        left: -16px;
        top: 26px;
        width: 73px;
        height: 34px;
      }
      .tile span {
        position: absolute;
        left: 6px;
      }
      .tile span:nth-of-type(1) {
        top: 13px;
      }
      .tile span:nth-of-type(2) {
        top: 21px;
      }
      .name {
        font-size: 24px;
        letter-spacing: -0.6px;
        color: #fdfdfd;
      }
      /* Mirrors the wallet's .ww-tee-notice card. */
      .notice {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: 420px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }
      .notice svg {
        flex: none;
      }
      .notice p {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        color: #fdfdfd;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="tile" aria-hidden="true">
          <svg
            aria-hidden="true"
            viewBox="0 0 89.2886 46.6703"

              </filter>
            </defs>
          </svg>
          <span>zk.</span>
          <span>money</span>
        </div>
        <div class="name">zk.money</div>
      </div>
      <div class="notice" role="status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#eed04e" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zM11 6.8h2v6.7h-2zM11 15.4h2v2.4h-2z"
          />

        <p>zk.money is under load right now. Check back later.</p>
      </div>
    </main>
  </body>
</html>
