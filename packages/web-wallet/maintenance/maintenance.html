      .page {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      }
      /* The wallet's .ww-brand lockup. */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        zoom: 0.72;
      }
      .tile {
        position: relative;
        width: 44px;
        height: 44px;
        overflow: hidden;
        border-radius: 8px;
        background: #181818;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
        font-size: 10.5px;
        line-height: 0.77;
        letter-spacing: -0.25px;
        color: #fdfdfd;
      }
      .tile svg {
        position: absolute;
        left: -16px;
        top: 26px;
        width: 73px;
        height: 34px;
      }
      .tile span {
        position: absolute;
        left: 6px;
      }
      .tile span:nth-of-type(1) {
        top: 13px;
      }
      .tile span:nth-of-type(2) {
        top: 21px;
      }
      .name {
        font-size: 24px;
        letter-spacing: -0.6px;
      }
      .panel {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
      }
      .intro {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .hero {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(#2b2b33, #141417);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 14px 44px rgba(156, 4, 255, 0.3);
      }
      .glyph {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(to right, #9c04ff, #0693ff);
      }
      .header {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.1;
      }
      .lede {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #bfc2d7;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid rgba(253, 253, 253, 0.08);
        background: rgba(255, 255, 255, 0.04);
      }
      .card[hidden] {
        display: none;
      }
      .eta {
        align-items: center;
        padding: 20px;
      }
      .eta p {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.3;
        color: #bfc2d7;
      }
      .eta time {
        font-size: 46px;
        font-weight: 600;
        line-height: 1.1;
      }
      .eta span {
        font-size: 12px;
        line-height: 1.3;
        color: #8b8fa8;

        line-height: 1.3;
        color: #b99cff;

      }

        text-decoration: underline;
      }
      @media (min-width: 960px) {
        .page {
          padding: 40px;
        }
        .brand {
          zoom: 1;
        }
        .panel {
          flex-direction: row;
          align-items: center;
          gap: 56px;
          max-width: 1000px;
          margin: auto;
          padding: 44px;
          border-radius: 32px;
          border: 1px solid rgba(255, 255, 255, 0.09);
          background: rgba(14, 14, 16, 0.8);
          -webkit-backdrop-filter: blur(20px);
          backdrop-filter: blur(20px);
          box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }
        .intro {
          flex: none;
          width: 400px;
          align-items: flex-start;
          gap: 20px;
          text-align: left;
        }
        .hero {
          width: 96px;
          height: 96px;
          border-radius: 28px;
        }
        h1 {
          font-size: 44px;
        }
        .lede {
          font-size: 17px;
        }
        .side {
          flex: 1;
          min-width: 0;
          gap: 24px;
        }
        .eta time {
          font-size: 52px;
        }
      }
    </style>
  </head>

      {
        const eta = document.querySelector(".eta")
        const until = new Date(eta.dataset.until)
        if (until > new Date()) {
          eta.querySelector("time").textContent = until.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit",
          })
          eta.hidden = false
        }
